name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Foreign-owned consent-store fixture (root-owned, world-writable; the suite runs as the ordinary runner user)
        # The one case that needs elevation to SET UP: a store this account does
        # not own and cannot chmod. tests/consent-store.test.ts reads the path
        # from the variable and asserts the refusal; without the variable it
        # skips with its reason. Failure to create the fixture fails the job
        # here rather than becoming a silent skip later.
        run: |
          set -e
          F="$RUNNER_TEMP/foreign-consent-store"
          sudo mkdir -p "$F/pending"
          sudo chmod 777 "$F" "$F/pending"
          test "$(stat -c %u "$F")" = "0" && test "$(stat -c %a "$F")" = "777"
          echo "SECRETLOOP_FOREIGN_STORE_FIXTURE=$F" >> "$GITHUB_ENV"
      - name: Foreign-owned consent RECORD fixture (a private store this account owns, holding one root-owned record)
        # The other case elevation is needed to SET UP: a record this account does not own, inside a
        # store it does. tests/consent-record-file.test.ts reads the path from the variable, asserts
        # the record really belongs to another account before concluding anything, and skips with its
        # reason where the variable is absent. Every assertion below runs under `set -e`, so a fixture
        # that cannot be built fails the job here rather than becoming a silent skip later.
        run: |
          set -e
          R="$RUNNER_TEMP/foreign-consent-record"
          rm -rf "$R"
          mkdir -p "$R/pending"
          chmod 700 "$R" "$R/pending"
          ID=$(printf 'f%.0s' $(seq 32))
          printf '%s' '{"not":"parsed — the refusal precedes parsing"}' > /tmp/foreign-record.json
          sudo install -o root -g root -m 600 /tmp/foreign-record.json "$R/pending/$ID.json"
          rm -f /tmp/foreign-record.json
          test "$(stat -c %u "$R")" = "$(id -u)"
          test "$(stat -c %u "$R/pending")" = "$(id -u)"
          test "$(stat -c %u "$R/pending/$ID.json")" = "0"
          test "$(stat -c %a "$R/pending/$ID.json")" = "600"
          echo "SECRETLOOP_FOREIGN_RECORD_FIXTURE=$R" >> "$GITHUB_ENV"
      - run: npm test

  test-windows:
    # NATIVE WINDOWS EXECUTION. Until this job existed, every Windows claim in
    # this repository was an inference from cross-platform Node APIs, and
    # `tests/binary-identity-paths.test.ts` said so in as many words: the
    # separator conversion in walk.ts is the identity on a POSIX host, so a
    # POSIX run cannot exercise it. This job is what makes a Windows statement
    # a measurement instead of a reason.
    #
    # One hosted runner is one measurement, not "Windows support". It runs
    # elevated, so symlink creation is permitted; a non-elevated user without
    # Developer Mode would see EPERM from the symlink fixtures, and the suite
    # would fail there rather than skip. Cases the platform cannot host -- a
    # FIFO, POSIX mode bits, a name under an open descriptor being replaced,
    # filenames NTFS refuses -- are reported by the harness as skips with
    # their reason, and a skip is counted apart from a pass.
    #
    # The same Node majors as the Linux `test` job, because the question is
    # whether the PRODUCT is portable, not whether one Node version is. The
    # Linux jobs and their check names are untouched -- this adds
    # `test-windows (18)` and `test-windows (20)` beside them and takes nothing
    # away, so branch protection keeps requiring exactly what it required
    # before.
    runs-on: windows-latest
    # A hard ceiling, because the readers under test are exactly the code whose
    # failure mode is an indefinite block on open. The Linux job inherits the
    # 360-minute default; a Windows hang would otherwise hold a runner for six
    # hours and report nothing legible.
    timeout-minutes: 30
    strategy:
      # Report both majors. With fail-fast, a Windows-only defect on 18 would
      # cancel 20 and hide whether the defect is version-specific -- which is
      # the first question asked when diagnosing one.
      fail-fast: false
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Before the suite, not after: five test files spawn `out/cli.js` as a
      # child process, so an unbuilt or stale `out/` makes the suite a test of
      # the wrong artifact. `pretest` guards this too; building here is what
      # lets that guard pass.
      - run: npm run compile
      - run: npm test

  test-windows-two-user:
    # THE CASE A SECOND ACCOUNT IS NEEDED FOR.
    #
    # A record planted by another ordinary account, and later caught by a
    # protected parent, has its INHERITED access list rewritten to name only the
    # owner, SYSTEM and Administrators -- it looks private -- while its owner
    # stays the account that planted it. A check that reads only the access list
    # accepts it. This job builds exactly that state and asserts the product
    # refuses it on the owner and transmits nothing.
    #
    # Provisioning local accounts needs elevation, so the runner SETS UP and the
    # ordinary account MEASURES: every assertion runs as `slprobe` through
    # Start-Process -Credential, and an administrator result is never presented
    # as an ordinary-user one. The record is produced by the real product's first
    # request, so no field is guessed.
    #
    # Added beside the existing jobs and taking nothing away: the Linux `test`
    # jobs, both `test-windows` jobs, the packaging jobs, the self-scan and their
    # check names are untouched, so branch protection keeps requiring exactly what
    # it required before. Nothing is masked -- no continue-on-error -- and a
    # fixture that cannot be built fails the job instead of becoming a skip.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Provision two ordinary accounts and the fixture parents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function NewPw { -join ((48..57 + 65..90 + 97..122) | Get-Random -Count 24 | ForEach-Object { [char]$_ }) + "aA1!" }
          $pw1 = NewPw; $pw2 = NewPw
          net user slprobe $pw1 /add /y | Out-Null
          net user slprobe2 $pw2 /add /y | Out-Null
          "slprobe:";  net user slprobe  | Select-String -Pattern "Local Group Memberships"
          "slprobe2:"; net user slprobe2 | Select-String -Pattern "Local Group Memberships"
          $sid1 = (New-Object System.Security.Principal.NTAccount("slprobe")).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $sid2 = (New-Object System.Security.Principal.NTAccount("slprobe2")).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $LAB = Join-Path $env:RUNNER_TEMP "acl-lab"
          New-Item -ItemType Directory -Force $LAB | Out-Null
          icacls $LAB /grant "*${sid1}:(OI)(CI)RX" "*${sid2}:(OI)(CI)RX" /q | Out-Null
          # A parent shaped like a real profile: the owner, SYSTEM and Administrators only.
          New-Item -ItemType Directory -Force (Join-Path $LAB "private") | Out-Null
          icacls (Join-Path $LAB "private") /inheritance:r /grant:r "*${sid1}:(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F" /q | Out-Null
          # A parent the second account can write: the shape the policy must refuse.
          New-Item -ItemType Directory -Force (Join-Path $LAB "permissive") | Out-Null
          icacls (Join-Path $LAB "permissive") /grant "*${sid1}:(OI)(CI)F" "*${sid2}:(OI)(CI)F" /q | Out-Null
          foreach ($d in @("out", "node_modules", "tests")) {
            icacls (Join-Path $PWD $d) /grant "*${sid1}:(OI)(CI)RX" "*${sid2}:(OI)(CI)RX" /q | Out-Null
          }
          $pw1 | Out-File -NoNewline (Join-Path $env:RUNNER_TEMP "p1.txt")
          $pw2 | Out-File -NoNewline (Join-Path $env:RUNNER_TEMP "p2.txt")
          "ACL_LAB=$LAB" >> $env:GITHUB_ENV
          "ACL_SID1=$sid1" >> $env:GITHUB_ENV
          "ACL_SID2=$sid2" >> $env:GITHUB_ENV
      - name: Plant a record with the real product, then hand it to the second account
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $LAB = $env:ACL_LAB
          $store = Join-Path $LAB "private\.secretloop"
          $repo = Join-Path $LAB "private\repo"
          $cred = New-Object System.Management.Automation.PSCredential("slprobe", (ConvertTo-SecureString (Get-Content -Raw (Join-Path $env:RUNNER_TEMP "p1.txt")) -AsPlainText -Force))
          $node = (Get-Command node).Source
          $o = Join-Path $env:RUNNER_TEMP "plant.out"; $e = Join-Path $env:RUNNER_TEMP "plant.err"
          $args = @((Join-Path $PWD "tests\fixtures\win-twouser-plant.js"), "--out", (Join-Path $PWD "out"), "--store", $store, "--repo", $repo)
          $p = Start-Process -FilePath $node -ArgumentList $args -Credential $cred -WorkingDirectory $LAB -RedirectStandardOutput $o -RedirectStandardError $e -PassThru -NoNewWindow -Wait
          Get-Content $o; if (Test-Path $e) { Get-Content $e }
          if ($p.ExitCode -ne 0) { throw "the fixture could not be planted (exit $($p.ExitCode)); nothing below would be evidence" }
          $record = ((Get-Content $o | Select-String -Pattern '^PLANTED-RECORD: ').Line -replace '^PLANTED-RECORD: ', '')
          if (-not $record) { throw "the fixture helper printed no record path" }
          # Ownership moves to the second account; the access list is left exactly as inherited,
          # which is the laundered state the policy has to catch.
          icacls $record /setowner "*$($env:ACL_SID2)" /q
          if ($LASTEXITCODE -ne 0) { throw "could not hand the planted record to the second account" }
          "--- the planted record, as the runner sees it"; icacls $record
          "ACL_STORE=$store" >> $env:GITHUB_ENV
          "ACL_REPO=$repo" >> $env:GITHUB_ENV
          # A second store whose pending directory grants the ordinary owner read access only.
          # The rule refuses it; because that account is NOT an administrator, the write it
          # governs must really fail, which an elevated job could never show.
          $rx = Join-Path $LAB "private\\rxstore"
          New-Item -ItemType Directory -Force (Join-Path $rx "pending") | Out-Null
          icacls $rx /inheritance:r /grant:r "*$($env:ACL_SID1):(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F" /q | Out-Null
          icacls (Join-Path $rx "pending") /inheritance:r /grant:r "*$($env:ACL_SID1):(OI)(CI)RX" "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F" /q | Out-Null
          "ACL_RX_STORE=$rx" >> $env:GITHUB_ENV
      - name: What the second ordinary account can and cannot do
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $LAB = $env:ACL_LAB
          $cred = New-Object System.Management.Automation.PSCredential("slprobe2", (ConvertTo-SecureString (Get-Content -Raw (Join-Path $env:RUNNER_TEMP "p2.txt")) -AsPlainText -Force))
          $node = (Get-Command node).Source
          $probe = Join-Path $PWD "tests\fixtures\win-twouser-attempt.js"
          function Attempt($tag, $dir, $out) {
            $err = "$out.err"
            $p = Start-Process -FilePath $node -ArgumentList @($probe, "--dir", $dir) -Credential $cred -WorkingDirectory $LAB -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow -Wait
            $text = ((Get-Content $out) -join " ")
            Write-Host "=== [$tag] as slprobe2: exit $($p.ExitCode) :: $text"
            if (Test-Path $err) { Get-Content $err | ForEach-Object { Write-Host "stderr: $_" } }
            if ($p.ExitCode -ne 0) { throw "the attempt probe [$tag] did not run; that is a non-measurement, not a refusal" }
            return $text
          }
          $private = Attempt "under the private parent" (Join-Path $LAB "private") (Join-Path $env:RUNNER_TEMP "a1.out")
          foreach ($op in @("create-store-name", "rename-parent", "delete-parent", "list-parent")) {
            if ($private -match ('"' + $op + '":"SUCCEEDED"')) { throw "the second account could $op under the private parent" }
          }
          # The control. These operations are not impossible; they are prevented by the parent's
          # permissions. Without a parent where they succeed, the refusals above prove nothing.
          $permissive = Attempt "under the permissive parent (the control)" (Join-Path $LAB "permissive") (Join-Path $env:RUNNER_TEMP "a2.out")
          if ($permissive -notmatch '"create-store-name":"SUCCEEDED"') {
            throw "the control failed: the second account could not create the store name even under a permissive parent, so the refusal above is not evidence"
          }
      - name: Where the ancestor rule draws the line on this image
        # Diagnostic, and evidence for the record: the chain verdict for the profile, for the
        # store path a real user would have, and for the OS temporary directory the test suite
        # uses. It asserts nothing; the cases above and below do the asserting.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node (Join-Path $PWD "tests\\fixtures\\win-chain-diagnostic.js") (Join-Path $PWD "out\\consent-acl-win.js")
      - name: The product, as the ordinary owner, against that fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $LAB = $env:ACL_LAB
          $cred = New-Object System.Management.Automation.PSCredential("slprobe", (ConvertTo-SecureString (Get-Content -Raw (Join-Path $env:RUNNER_TEMP "p1.txt")) -AsPlainText -Force))
          $runner = Join-Path $LAB "run-two-user.cmd"
          $lines = @(
            "@echo off",
            ("cd /d " + '"' + $PWD + '"'),
            "set SECRETLOOP_WIN_TWOUSER_STORE=$env:ACL_STORE",
            "set SECRETLOOP_WIN_TWOUSER_REPO=$env:ACL_REPO",
            "set SECRETLOOP_WIN_ATTACKER_SID=$env:ACL_SID2",
            ("set SECRETLOOP_WIN_PERMISSIVE_PARENT=" + (Join-Path $LAB "permissive")),
            "set SECRETLOOP_WIN_RX_STORE=$env:ACL_RX_STORE",
            "set SECRETLOOP_WIN_EXPECTED_SID=$env:ACL_SID1",
            "node node_modules\ts-node\dist\bin.js --transpile-only tests\consent-acl-win-twouser.test.ts"
          )
          Set-Content -Path $runner -Value $lines -Encoding ASCII
          icacls $runner /grant "*$($env:ACL_SID1):RX" /q | Out-Null
          $o = Join-Path $env:RUNNER_TEMP "suite.out"; $e = Join-Path $env:RUNNER_TEMP "suite.err"
          $p = Start-Process -FilePath (Join-Path $env:SystemRoot "System32\cmd.exe") -ArgumentList @("/d", "/c", $runner) -Credential $cred -WorkingDirectory $LAB -RedirectStandardOutput $o -RedirectStandardError $e -PassThru -NoNewWindow -Wait
          Get-Content $o; if (Test-Path $e) { Get-Content $e }
          if ($p.ExitCode -ne 0) { throw "the two-account cases failed (exit $($p.ExitCode))" }
          if (((Get-Content $o) -join "`n") -match "skip - ") { throw "a two-account case skipped inside the job that exists to run it" }

  packaging-windows:
    # The same two packaging smokes as `packaging`, on a native Windows runner.
    # Both scripts are bash; on windows-latest `shell: bash` is Git for
    # Windows' bash, which is the only shell a Windows maintainer would run them
    # from. Node 22 for the same reason the Linux job pins it: @vscode/vsce
    # requires node >= 20, and the test matrix, not this job, covers 18.
    # Not a required check; it adds beside the Linux job and takes nothing away.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Smoke the npm tarball
        shell: bash
        run: npm run smoke:tarball
      - name: Smoke the VSIX
        shell: bash
        if: always()
        run: npm run smoke:vsix

  packaging:
    # The release checks, run on every change rather than only at release time.
    # 0.1.6 shipped a VSIX carrying dev dependencies because it was packaged from
    # a working tree instead of a clean checkout, and 0.1.7 existed only to
    # republish it. smoke:vsix is the check that catches exactly that -- it diffs
    # the built archive against scripts/vsix-manifest.txt -- and it had never run
    # anywhere but a maintainer's laptop.
    #
    # A separate job on purpose: GitHub gives each job its own runner and its own
    # checkout, so this packages from a clean install the way a release does. The
    # setup-node cache holds ~/.npm, the download cache, and never a populated
    # node_modules -- sharing one of those between jobs would reproduce the
    # contamination this job exists to detect.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Read from the resolved install rather than the declared range:
          # package.json asks for "^3.0.0", which settles nothing about what
          # is installed. @vscode/vsce 3.9.2 requires node ">= 20" -- agreed by
          # the installed package, package-lock.json and the registry entry for
          # that immutable version (checked 2026-09-04).
          #
          # Not 20, because Node 20 reached end-of-life on 2026-04-30 per the
          # Node release schedule and is no longer a supported release line.
          # The LTS majors in support on that date are 22 (maintenance, EOL
          # 2027-04-30) and 24 (active, EOL 2028-04-30); 22 is the lower of the
          # two, so it is the floor this job pins to rather than the only
          # version that would work.
          #
          # The package itself still supports node >= 18. The test matrix is
          # what covers that, and this job says nothing about it.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Smoke the npm tarball
        run: npm run smoke:tarball
      - name: Smoke the VSIX
        run: npm run smoke:vsix

  test-macos:
    # Native macOS, which this workflow did not have. The macOS consent rules -- the extended-ACL
    # refusal from PR #93 and the ancestor rule here -- skip on Linux and Windows with their
    # reason, so before this job they were exercised only on a developer machine and never in CI.
    #
    # Added beside the existing jobs and taking nothing away: every existing job, check name and
    # permission is untouched, so branch protection keeps requiring exactly what it required
    # before. `macos-latest` is a standard GitHub-hosted runner and this repository is public, so
    # it costs no minutes and needs no plan change, no larger runner and no billing change.
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # A fresh build BEFORE anything runs the bundled CLI: several suites spawn out/cli.js, and a
      # stale bundle would test the wrong code. The repository's own freshness check then confirms
      # it rather than assuming it.
      - run: npm run compile
      - name: Record the environment this ran in
        run: |
          set -e
          echo "runner image : $ImageOS  $ImageVersion"
          echo "arch         : $(uname -m)"
          echo "macOS        : $(sw_vers -productVersion) build $(sw_vers -buildVersion)"
          echo "node         : $(node -v)  ($(node -p 'process.arch'))"
          echo "euid         : $(id -u)  user: $(whoami)"
          echo "TMPDIR chain :"
          p=$(cd "${TMPDIR:-/tmp}" && pwd -P)
          while :; do
            printf '  mode=%s uid=%s %s\n' "$(stat -f '%OLp' "$p")" "$(stat -f '%u' "$p")" "$p"
            up=$(dirname "$p"); [ "$up" = "$p" ] && break; p=$up
          done
      - run: node scripts/check-build-fresh.js
      - name: The consent, ACL, parser, creation and parent-chain suites, natively
        run: |
          set -e
          npx ts-node --transpile-only tests/consent-store.test.ts
          npx ts-node --transpile-only tests/consent-record-file.test.ts
          npx ts-node --transpile-only tests/consent-acl-macos.test.ts
          npx ts-node --transpile-only tests/consent-parent-chain.test.ts
          npx ts-node --transpile-only tests/verify-consent.test.ts
      - name: The full suite
        run: npm test
      - name: Packaging smoke
        run: npm run smoke:tarball

  test-macos-two-user:
    # The cross-user half, which no macOS evidence has ever covered: the product running as an
    # ordinary owner while a SECOND ordinary account attempts the attacks. Everything before this
    # was single-account, and a single-account result is not a substitute.
    #
    # Provisioning needs administrative rights and is kept in its own step, separate from every
    # step that runs the product. If provisioning cannot work on a hosted runner, this job FAILS
    # there and says so rather than skipping quietly into a false green.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Can this runner create a second ordinary account at all?
        id: provision
        run: |
          set -e
          echo "whoami: $(whoami) uid=$(id -u)"
          echo "sudo  : $(sudo -n true 2>&1 && echo 'passwordless' || echo 'NOT available')"
          NEXT=4001
          sudo sysadminctl -addUser slattack -password slattackpw -UID $NEXT 2>&1 | tail -5 || true
          if id -u slattack >/dev/null 2>&1; then
            echo "second account created: uid=$(id -u slattack)"
            echo "created=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::error::sysadminctl could not create a second ordinary account on this runner."
            echo "created=no" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: The two-account cases, product as the owner and attacks as the second account
        if: steps.provision.outputs.created == 'yes'
        env:
          SECRETLOOP_MAC_ATTACKER: slattack
        run: npx ts-node --transpile-only tests/consent-macos-two-user.test.ts

  diag-windows-budget:
    # DISPOSABLE DIAGNOSTIC JOB on a throwaway branch. Never merged, asserts nothing beyond the
    # suite's own assertions, and exists to split the 51.1 s that the post-merge failure showed
    # between fixture setup and the consent operation itself, and to name the checkpoint that
    # refuses. Node 20 and windows-latest, matching the job that failed.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: The failing test, with its normal fixture and ordering, instrumented
        shell: bash
        run: |
          set -uo pipefail
          echo "--- environment"
          node -p "'node ' + process.version + ' ' + process.arch + ' on ' + process.platform"
          # TWO DEFECTS IN THE FIRST ATTEMPT, both mine, both corrected here.
          #   1. $PWD under Git-bash is a POSIX path (/d/a/...). node on Windows cannot resolve
          #      that through NODE_OPTIONS --require, so it exited immediately. cygpath -w now
          #      converts it, and the resolved path is printed and checked before use.
          #   2. The output was piped straight into grep, so the startup error that explained the
          #      emptiness was filtered away. Output is now captured whole and a bounded slice is
          #      printed, including the tail, so a failure cannot hide again.
          SHIM="$(cygpath -w "$PWD/tests/fixtures/budget-trace-shim.js")"
          echo "shim path: $SHIM"
          node --require "$SHIM" -e "console.log('shim loads: yes')" || echo "shim DID NOT LOAD"
          echo "--- three runs of the real file, stderr trace on, so variance is visible"
          for i in 1 2 3; do
            echo "===== attempt $i ====="
            NODE_OPTIONS="--require $SHIM" \
              npx ts-node --transpile-only tests/verify-consent.test.ts > "run$i.txt" 2>&1 || true
            echo "  exit captured; $(wc -l < "run$i.txt") lines"
            grep -E "BTRACE (operation|REFUSED)|BTRACE.*powershell|CONSENT_REQUIRED and makes zero|passed," "run$i.txt" | head -40 || true
            echo "  --- last 8 lines, so a startup failure cannot hide ---"
            tail -8 "run$i.txt" | sed 's/^/    /'
          done

  self-scan:
    # A secret scanner that leaks a secret is the worst possible headline, so
    # the tool runs against its own repo on every PR.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the history scan has something to scan
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Use the CI scan config
        # tests/fixtures.ts generates credential-shaped strings on purpose, so the
        # self-scan would otherwise fail on the test suite rather than on a real
        # leak. This scopes the exclusion to CI only — it is not checked in as
        # .secretloop.json, so local scans still cover tests/.
        run: cp .github/secretloop.ci.json .secretloop.json
      - name: Scan working tree
        run: node out/cli.js scan --format sarif --output secretloop.sarif --fail-on high
      - name: Scan git history
        if: always()
        run: node out/cli.js history --fail-on critical
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: secretloop.sarif
