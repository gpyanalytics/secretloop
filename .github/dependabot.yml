# Weekly npm updates, watching both dependency types — package.json declares no
# runtime dependencies today, but a filter that assumes that would silently stop
# watching the moment one is added.
#
# Two majors are ignored, both because they would land ahead of where this
# project actually is:
#
#   @types/node — the types must not run ahead of engines.node. A major above
#     the floor lets tsc accept APIs the oldest supported runtime does not have:
#     against @types/node 26 a call to fs.glob (Node 22) compiles clean and then
#     throws on Node 18. Pinned to the floor's major instead; minor and patch
#     updates still arrive.
#
#   typescript — a major is a migration, not an update. TS 7 fails
#     `npm run compile` on every CI job today, and moving to it is work to
#     schedule rather than a PR to merge. Minor and patch keep flowing.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
